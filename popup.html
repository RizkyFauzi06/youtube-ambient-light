<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            width: 260px;
            padding: 18px;
            margin: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
            background: #202020;
            color: #fff;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .icon {
            font-size: 25px;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .description {
            margin: 0 0 16px;
            color: #c7c7c7;
            font-size: 13px;
            line-height: 1.5;
        }

        .notice {
            padding: 12px;
            border-radius: 8px;
            background: #303030;
            font-size: 12px;
            line-height: 1.6;
        }

        .notice strong {
            display: block;
            margin-bottom: 4px;
            color: #8ce0ad;
            font-size: 13px;
        }

        .footer {
            margin-top: 14px;
            color: #999;
            font-size: 11px;
        }
    </style>
</head>

<body>
    <header class="header">
        <span class="icon" aria-hidden="true">💡</span>
        <h1>YouTube Ambient Light</h1>
    </header>

    <p class="description">
        Nikmati efek cahaya ambient yang mengikuti warna video
        YouTube yang sedang diputar.
    </p>

    <section class="notice">
        <strong>Pengaturan Ambient Light</strong>
        Buka video YouTube, klik ikon ⚙️ pada pemutar,
        lalu pilih Ambient Light untuk mengatur status dan
        intensitas cahaya.
    </section>

    <footer class="footer">
        Pengaturan tersimpan secara otomatis.
    </footer>
</body>
</html>
